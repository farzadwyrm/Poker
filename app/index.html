<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Poker Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: slim top bar; the felt is the hero with your action bar docked under it; the coach rides in a glass rail on the right; study tabs below.
   One deliberate dark look (no light variant): midnight surfaces, emerald felt, gold for money and the primary action. */
:root {
  color-scheme: dark;
  --bg: #06080c; --bg2: #0b0f16; --panel: #11161f; --panel2: #161d28; --raise: #1c2533;
  --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.13);
  --fg: #ecf1f8; --muted: #93a0b3; --dim: #64707f;
  --gold: #f2b84b; --gold-hi: #ffd88a; --gold-lo: #b9801a; --on-gold: #1d1404;
  --mint: #34d399; --amber: #fbbf24; --red: #fb4d6d; --wine: #c0264a; --blue: #4f8cff;
  --felt-hi: #12805f; --felt: #0a5a43; --felt-lo: #04291f; --rim: #141920;
  --card: #fbfbf8; --suit-s: #111827; --suit-h: #e11d48; --suit-d: #2563eb; --suit-c: #059669;
  --f-ui: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
  --glass: linear-gradient(180deg, rgba(28,37,51,.82), rgba(17,22,31,.9));
  --shadow: 0 18px 50px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: radial-gradient(1200px 600px at 30% -10%, #10202a 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #1a1424 0%, transparent 55%), var(--bg);
  color: var(--fg); font: 14px/1.5 var(--f-ui); min-height: 100vh; }
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line2); background: var(--raise); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: transform .08s, border-color .15s, background .15s; }
.btn:hover { border-color: rgba(255,255,255,.28); background: #222d3d; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo)); color: var(--on-gold); border-color: transparent; box-shadow: 0 6px 18px rgba(242,184,75,.25); }
.btn.small { padding: 5px 11px; font-size: 12px; border-radius: 99px; }
.btn:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
select { border: 1px solid var(--line2); background: var(--raise); padding: 7px 10px; border-radius: 10px; color: var(--fg); }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 22px; padding: 10px 14px; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); }
.brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; color: var(--on-gold); background: linear-gradient(145deg, var(--gold-hi), var(--gold-lo)); box-shadow: 0 6px 16px rgba(242,184,75,.3); }
.logo h1 { font-size: 18px; font-weight: 800; }
.logo h1 span { color: var(--gold); }
.level { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 99px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.level .badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 800 13px var(--f-ui); color: var(--gold);
  background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255,255,255,.08) 0); position: relative; }
.level .badge::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--panel); }
.level .badge span { position: relative; }
.level .title { font-weight: 700; font-size: 12.5px; line-height: 1.1; }
.level .xptext { font-size: 11px; color: var(--muted); font-family: var(--f-num); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 700 15px var(--f-num); }
.settings { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--line2); border-radius: 10px; background: var(--raise); cursor: pointer; user-select: none; font-size: 13px; }
.toggle input { accent-color: var(--gold); margin: 0; }
.pos-c { color: var(--mint); } .neg-c { color: var(--red); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1060px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 12px; min-width: 0; }

/* Table */
.table { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9.4; }
.felt { position: absolute; inset: 12% 9% 15%; border-radius: 999px;
  background:
    radial-gradient(ellipse 70% 60% at 50% 38%, rgba(255,255,255,.10), transparent 60%),
    radial-gradient(ellipse at 50% 45%, var(--felt-hi) 0%, var(--felt) 48%, var(--felt-lo) 100%);
  box-shadow: inset 0 0 0 2px rgba(242,184,75,.16), inset 0 0 70px rgba(0,0,0,.55),
    0 0 0 13px var(--rim), 0 0 0 14px rgba(255,255,255,.07), 0 0 0 22px #0b0e13, 0 34px 80px rgba(0,0,0,.65); }
.felt::after { content: "POKER COACH"; position: absolute; left: 50%; top: 73%; transform: translate(-50%, -50%); font: 800 13px var(--f-ui); letter-spacing: .5em; color: rgba(255,255,255,.07); white-space: nowrap; }
.center { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 8px; z-index: 2; }
.pot { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 6px; border-radius: 99px; background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.08); }
.pot .ico { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--gold-hi), var(--gold-lo)); box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), inset 0 0 0 5px rgba(255,255,255,.35); }
.pot b { font: 700 15px var(--f-num); color: var(--gold-hi); }
.pot .label { color: rgba(255,255,255,.55); }
.board { display: flex; gap: 6px; min-height: 74px; }
.streetline { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.5); font-weight: 600; }
.result { font-size: 13px; text-align: center; max-width: 36ch; min-height: 1.5em; font-weight: 600; color: #fff; }
.result.win { padding: 3px 12px; border-radius: 99px; background: rgba(52,211,153,.16); border: 1px solid rgba(52,211,153,.35); color: #b7f5dc; }

/* Cards */
.card { --w: 34px; width: var(--w); height: calc(var(--w) * 1.4); border-radius: calc(var(--w) * .12); background: linear-gradient(180deg, #ffffff, #eeeeea); color: var(--suit-s);
  display: inline-grid; place-items: center; font: 700 calc(var(--w) * .42)/1 var(--f-ui); box-shadow: 0 2px 6px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.06); position: relative; flex: none; }
.card .in { display: grid; justify-items: center; gap: 1px; }
.card .s { font-size: calc(var(--w) * .38); line-height: 1; }
.card.s-h { color: var(--suit-h); } .card.s-d { color: var(--suit-d); } .card.s-c { color: var(--suit-c); }
.two-color .card.s-d { color: var(--suit-h); } .two-color .card.s-c { color: var(--suit-s); }
.card.back { background: radial-gradient(circle at 50% 50%, #4b1730 0 18%, transparent 19%), repeating-linear-gradient(45deg, #7a1d3e 0 5px, #5c1430 5px 10px); border: 2px solid #f3e9dc; }
.board .card { --w: 52px; }
.board .slot { width: 52px; height: 73px; border-radius: 6px; border: 1.5px dashed rgba(255,255,255,.14); }
.card.deal { animation: deal .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes deal { from { transform: translateY(-14px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }

/* Seats */
.seat { position: absolute; transform: translate(-50%, -50%); width: 128px; display: grid; justify-items: center; z-index: 3; }
.seat .hole { display: flex; height: 40px; margin-bottom: -14px; z-index: 0; }
.seat .hole .card { --w: 30px; }
.seat .hole .card:nth-child(2) { margin-left: -10px; transform: rotate(7deg) translateY(1px); }
.seat .hole .card:nth-child(1) { transform: rotate(-5deg); }
.avwrap { position: relative; width: 58px; height: 58px; z-index: 1; }
.av { position: absolute; inset: 4px; border-radius: 50%; display: grid; place-items: center; font: 800 18px var(--f-ui); color: #fff;
  background: radial-gradient(circle at 35% 30%, hsl(var(--hue) 70% 62%), hsl(var(--hue) 55% 30%)); box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.5); border: 2px solid rgba(0,0,0,.45); }
.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.5; }
.ring .track { stroke: rgba(255,255,255,.08); }
.ring .bar { stroke: var(--gold); stroke-dasharray: 169.6; stroke-dashoffset: 0; stroke-linecap: round; opacity: 0; }
.seat.active .ring .bar { opacity: 1; animation: countdown var(--dur, 1s) linear forwards; }
.seat.hero.active .ring .bar { animation: none; filter: drop-shadow(0 0 6px var(--gold)); }
@keyframes countdown { to { stroke-dashoffset: 169.6; stroke: var(--red); } }
.badge-pos { position: absolute; right: -10px; bottom: 2px; z-index: 2; font: 700 9px var(--f-num); padding: 2px 5px; border-radius: 6px; background: #0d1219; border: 1px solid var(--line2); color: var(--muted); }
.badge-pos.btn-pos { background: #f6f1e4; color: #1a1a1a; border-color: transparent; }
.np { position: relative; margin-top: -8px; width: 100%; padding: 9px 10px 11px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line2); box-shadow: 0 8px 18px rgba(0,0,0,.4); display: grid; text-align: center; gap: 0; }
.np .nm { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .stk { font: 700 12.5px var(--f-num); color: var(--gold-hi); }
.np .hud { font: 500 10px var(--f-num); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); z-index: 4; font: 800 10px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.tag.fold { background: #2a3140; color: #aab4c3; } .tag.check { background: #24405f; color: #cfe2ff; } .tag.call { background: #1f5f8b; color: #e6f3ff; }
.tag.raise { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--on-gold); } .tag.allin { background: linear-gradient(180deg, #ff7a8f, var(--wine)); color: #fff; }
.tag.blind { background: #2a3140; color: var(--muted); } .tag.win { background: linear-gradient(180deg, #6ef0bd, #16a571); color: #062418; }
.seat.folded .avwrap { opacity: .45; filter: grayscale(.8); }
.seat.folded .np { opacity: .8; }
.seat.folded .np .hud { display: none; }
.seat.winner .av { box-shadow: 0 0 0 3px var(--mint), 0 0 24px rgba(52,211,153,.55); }
.seat.hero .hole { height: 74px; margin-bottom: -18px; }
.seat.hero .hole .card { --w: 54px; }
.seat.hero .hole .card:nth-child(2) { margin-left: -14px; }
.seat.hero .np { background: linear-gradient(180deg, rgba(242,184,75,.16), rgba(17,22,31,.92)); border-color: rgba(242,184,75,.35); }
.bet { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px; z-index: 2; }
.bet .stack { position: relative; width: 16px; height: 18px; }
.bet .stack i { position: absolute; left: 0; width: 16px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.4); }
.bet .stack i:nth-child(1) { bottom: 0; background: #e5484d; } .bet .stack i:nth-child(2) { bottom: 4px; background: var(--blue); } .bet .stack i:nth-child(3) { bottom: 8px; }
.bet b { font: 700 12px var(--f-num); color: #fff; background: rgba(0,0,0,.5); padding: 1px 7px; border-radius: 99px; }
.dealer { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #d9d4c7); color: #1a1a1a; font: 800 11px/22px var(--f-ui); text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.5); z-index: 2; }
@media (max-width: 680px) {
  .table { aspect-ratio: 3 / 4.3; }
  .felt { inset: 9% 14% 13%; }
  .felt::after { display: none; }
  .seat { width: 86px; }
  .avwrap { width: 42px; height: 42px; }
  .av { font-size: 14px; inset: 3px; }
  .np { padding: 7px 5px 4px; }
  .np .nm, .np .stk { font-size: 11px; }
  .np .hud { display: none; }
  .seat .hole { height: 30px; margin-bottom: -10px; }
  .seat .hole .card { --w: 22px; }
  .tag { bottom: -8px; font-size: 9px; padding: 2px 6px; }
  .seat.hero .hole { height: 56px; }
  .seat.hero .hole .card { --w: 40px; }
  .board .card { --w: 36px; }
  .board .slot { width: 36px; height: 50px; }
  .board { min-height: 50px; gap: 4px; }
}

/* Action bar */
.dock { background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: center; box-shadow: var(--shadow); }
@media (max-width: 760px) { .dock { grid-template-columns: minmax(0, 1fr); } }
.hand { display: grid; gap: 4px; min-width: 0; }
.hand b { font-size: 16px; font-weight: 700; }
.mini-cards { display: none; }
.hand .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipinfo { font: 600 11.5px var(--f-num); padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--muted); }
.chipinfo b { color: var(--fg); font-size: 11.5px; }
.acts { display: grid; gap: 10px; justify-items: end; min-width: 0; }
@media (max-width: 760px) { .acts { justify-items: stretch; } }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acts .row.main-acts { flex-wrap: nowrap; }
.act { min-width: 124px; min-height: 56px; padding: 10px 18px; font-size: 15px; font-weight: 800; letter-spacing: .02em; border-radius: 12px; position: relative; text-transform: uppercase; }
@media (max-width: 760px) { .act { min-width: 0; flex: 1; padding: 13px 8px; font-size: 13.5px; } }
.act.fold { background: linear-gradient(180deg, #3a1621, #2a0f17); border-color: rgba(251,77,109,.35); color: #ff9db0; }
.act.callb { background: linear-gradient(180deg, #23344c, #182436); border-color: rgba(79,140,255,.35); color: #dbe7ff; }
.act .sub { display: block; font: 700 12px var(--f-num); letter-spacing: 0; text-transform: none; opacity: .85; }
.act.pick { box-shadow: 0 0 0 2px var(--mint), 0 0 22px rgba(52,211,153,.45); }
.act.pick::after { content: "Coach pick"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font: 800 9px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; background: var(--mint); color: #052016; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.sizer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
@media (max-width: 760px) { .sizer { justify-content: flex-start; } }
.sizer input[type=range] { width: 170px; accent-color: var(--gold); }
.sizer input[type=number] { width: 84px; font: 700 13px var(--f-num); padding: 6px 8px; border: 1px solid var(--line2); border-radius: 8px; background: #0b1017; color: var(--gold-hi); }
.kbd { font: 500 11px var(--f-num); color: var(--dim); }
.waiting { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dots::after { content: "…"; animation: blink 1s steps(3) infinite; }
@keyframes blink { 50% { opacity: .3; } }

/* Coach rail */
.coach { background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r); display: grid; min-width: 0; overflow: hidden; box-shadow: var(--shadow); }
.coach-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(52,211,153,.10), transparent 70%); }
.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 800 16px var(--f-ui); color: #052016; flex: none; background: linear-gradient(145deg, #7af2c6, #16a571); box-shadow: 0 6px 16px rgba(52,211,153,.3); }
.coach-head .who { display: grid; flex: 1; min-width: 0; }
.coach-head .who span { font-size: 12px; color: var(--muted); }
.coach-body { padding: 14px; display: grid; gap: 12px; }
.bubble { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; display: grid; gap: 9px; font-size: 13.5px; }
.bubble.lead { border-color: rgba(52,211,153,.28); background: linear-gradient(180deg, rgba(52,211,153,.08), rgba(0,0,0,.25)); }
.bubble b { color: #fff; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.facts div { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; min-width: 0; }
.facts b { display: block; font: 700 14px var(--f-num); color: var(--gold-hi); overflow-wrap: anywhere; }
.grade { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 99px; }
.grade.good { background: rgba(52,211,153,.16); color: #6ef0bd; border: 1px solid rgba(52,211,153,.35); }
.grade.ok { background: rgba(251,191,36,.14); color: #fcd34d; border: 1px solid rgba(251,191,36,.35); }
.grade.mistake { background: rgba(251,77,109,.14); color: #ff8fa3; border: 1px solid rgba(251,77,109,.35); }
.grade.blunder { background: rgba(192,38,74,.3); color: #ffc2cf; border: 1px solid rgba(251,77,109,.6); }
.fb-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fb-cards { display: flex; gap: 4px; align-items: center; }
.fb-cards .card { --w: 26px; }
.xp { font: 700 12px var(--f-num); color: var(--gold); }
.concept { border: 1px solid rgba(242,184,75,.3); background: rgba(242,184,75,.08); color: var(--gold-hi); border-radius: 99px; padding: 3px 11px; font-size: 12px; cursor: pointer; font-weight: 600; }
.concept:hover { background: rgba(242,184,75,.16); }
.claude-out { font-size: 13px; white-space: pre-wrap; background: rgba(79,140,255,.08); border: 1px solid rgba(79,140,255,.25); border-radius: 10px; padding: 9px 11px; }
.history { border-top: 1px solid var(--line); max-height: 300px; overflow: auto; }
.history h3 { padding: 12px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.rv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; padding: 9px 16px; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer; width: 100%; align-items: center; color: var(--fg); }
.rv:hover, .rv[aria-current="true"] { background: rgba(255,255,255,.04); }
.rv .t { font-size: 13px; min-width: 0; }
.rv .t span { color: var(--muted); }
.rv .loss { font: 700 12px var(--f-num); color: var(--red); }
.empty { padding: 10px 16px 16px; color: var(--muted); font-size: 13px; }

/* Study panel */
.panel { background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r); min-width: 0; box-shadow: var(--shadow); }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs { scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; font-weight: 700; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 13.5px; }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--gold); }
.tabpane { padding: 16px; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.lesson { border: 1px solid var(--line); background: rgba(0,0,0,.2); border-radius: 14px; padding: 14px; display: grid; gap: 7px; align-content: start; }
.lesson.hl { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242,184,75,.4); }
.lesson p { font-size: 13px; color: var(--muted); }
.meter { height: 5px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.meter span { display: block; height: 100%; background: linear-gradient(90deg, #16a571, var(--mint)); }
.lesson .m { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 820px; font-size: 13px; }
th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.drift { font-family: var(--f-num); font-size: 12px; }
.drift .arrow { color: var(--dim); }
.log { font: 500 12px/1.75 var(--f-num); color: var(--muted); max-height: 260px; overflow: auto; }
.note { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; max-width: 80ch; }
.chat { display: grid; gap: 12px; }
.msgs { display: grid; gap: 10px; max-height: 460px; overflow: auto; padding: 2px; align-content: start; }
.msg { max-width: 78ch; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: linear-gradient(180deg, rgba(242,184,75,.2), rgba(242,184,75,.1)); border: 1px solid rgba(242,184,75,.3); border-radius: 14px 14px 4px 14px; }
.msg.assistant { justify-self: start; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; }
.msg.err { color: var(--red); }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; min-height: 46px; max-height: 160px; resize: vertical; font: 14px/1.45 var(--f-ui); padding: 11px 13px; border: 1px solid var(--line2); border-radius: 12px; background: #0b1017; color: var(--fg); }
.composer textarea::placeholder { color: var(--dim); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 760px) {
  .dock { position: sticky; bottom: 0; z-index: 20; background: linear-gradient(180deg, rgba(22,29,40,.97), rgba(11,15,22,.98)); padding: 10px 12px max(10px, env(safe-area-inset-bottom, 0px)); border-radius: 16px 16px 0 0; }
  .kbd { display: none; }
  .hand { grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; }
  .hand > :not(.mini-cards) { grid-column: 2; }
  .mini-cards { display: flex; gap: 3px; grid-row: 1 / span 3; align-self: center; }
  .mini-cards .card { --w: 34px; }
  .hand b { font-size: 13.5px; }
  .hand .chips .chipinfo:not(:last-child) { display: none; }
  .hand .chips .chipinfo:only-child { display: inline-block; }
  .sizer input[type=number] { display: none; }
  .sizer input[type=range] { flex: 1; min-width: 90px; width: auto; }
}
@media (max-width: 600px) {
  .top { padding: 8px 10px; gap: 8px 12px; }
  .stats { gap: 14px; width: 100%; justify-content: space-between; }
  .stats b { font-size: 13px; }
  .settings { width: 100%; }
  .settings .label { display: none; }
  .settings select, .settings .toggle { padding: 6px 8px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="mark" aria-hidden="true">♠</span><h1>Poker <span>Coach</span></h1></div>
      <div class="level" id="level"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="settings">
      <label class="label" for="mode" style="margin-right:-2px">Coach</label>
      <select id="mode">
        <option value="teach">Teach me</option>
        <option value="quiz">Quiz me</option>
        <option value="review">Review after</option>
      </select>
      <select id="speed" aria-label="Opponent speed">
        <option value="1000">Slow</option>
        <option value="550" selected>Normal</option>
        <option value="220">Fast</option>
      </select>
      <label class="toggle"><input type="checkbox" id="fourColor" checked> 4-colour deck</label>
      <label class="toggle"><input type="checkbox" id="watch"> Watch AI only</label>
    </div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Table">
      <div class="table" id="table"></div>
      <div class="dock" id="dock"></div>
    </section>

    <aside class="coach" aria-label="Coach">
      <div class="coach-head">
        <div class="avatar" aria-hidden="true">C</div>
        <div class="who"><h2>Coach</h2><span id="coachSub"></span></div>
      </div>
      <div class="coach-body" id="coachBody"></div>
      <div class="history" id="history"></div>
    </aside>
  </div>

  <section class="panel" aria-label="Study">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="chat" aria-selected="true">Coach chat</button>
      <button class="tab" role="tab" data-tab="lessons" aria-selected="false">Lessons</button>
      <button class="tab" role="tab" data-tab="opponents" aria-selected="false">Opponents</button>
      <button class="tab" role="tab" data-tab="log" aria-selected="false">Hand log</button>
    </div>
    <div class="tabpane" id="tabpane"></div>
  </section>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const P = window.Poker;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const pct = x => Math.round(x * 100) + '%';
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const GRADE = { good: 'Good', ok: 'Okay', mistake: 'Mistake', blunder: 'Blunder' };
  const XP_FOR = { good: 10, ok: 4, mistake: 0, blunder: 0 };
  const TITLES = ['Beginner', 'Learner', 'Regular', 'Grinder', 'Strategist', 'Shark', 'Crusher'];
  const XP_PER_LEVEL = 150;
  const STYLE_REVEAL_HANDS = 25;

  const game = new P.Game();
  const hero = game.players[0];
  const setHero = on => { hero.human = on; hero.name = on ? 'Hero' : 'Juno'; hero.style = on ? 'You' : 'Novice'; };
  setHero(true);

  let mode = 'teach', speed = 550, watching = false, running = false, timer = null;
  let advice = null, adviceKey = '', quizShown = false;
  let shownId = null, drill = null, tab = 'chat', hlConcept = null;
  let sample = null, toolsOk = false; const claudeState = {};
  const chat = []; let chatBusy = false, chatCtl = null;

  // ---------- Progress (per viewer, kept in this browser) ----------
  const STORE = 'pokercoach.progress.v2';
  let progress = { xp: 0, streak: 0, best: 0, decisions: 0, good: 0, ok: 0, concepts: {}, lastXp: 0 };
  try { const saved = JSON.parse(localStorage.getItem(STORE) || 'null'); if (saved) progress = { ...progress, ...saved }; } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} };

  function addProgress(r) {
    let xp = XP_FOR[r.grade];
    if (r.grade === 'good') { progress.streak++; if (progress.streak >= 3) xp += 5; } else if (r.grade !== 'ok') progress.streak = 0;
    progress.best = Math.max(progress.best, progress.streak);
    progress.xp += xp; progress.lastXp = xp;
    progress.decisions++;
    if (r.grade === 'good') progress.good++; else if (r.grade === 'ok') progress.ok++;
    const c = progress.concepts[r.concept] || (progress.concepts[r.concept] = { n: 0, pts: 0 });
    c.n++; c.pts += r.grade === 'good' ? 1 : r.grade === 'ok' ? 0.5 : 0;
    save();
  }

  // ---------- Cards ----------
  function cardHTML(c, extra) {
    const s = P.suitOf(c);
    const r = P.RANKS[P.rankOf(c)].replace('T', '10');
    return `<span class="card s-${'shdc'[s]}${extra ? ' ' + extra : ''}" aria-label="${r}${'shdc'[s]}"><span class="in">${r}<span class="s">${P.SUIT_GLYPHS[s]}</span></span></span>`;
  }
  const backHTML = () => '<span class="card back" aria-hidden="true"></span>';

  // ---------- Header ----------
  function renderHeader() {
    const lvl = Math.floor(progress.xp / XP_PER_LEVEL);
    const into = progress.xp - lvl * XP_PER_LEVEL;
    $('level').innerHTML = `<span class="badge" style="--p:${into / XP_PER_LEVEL * 100}"><span>${lvl + 1}</span></span>
      <span><span class="title">${TITLES[Math.min(lvl, TITLES.length - 1)]}</span><br>
      <span class="xptext">${into} / ${XP_PER_LEVEL} XP</span></span>`;
    const net = hero.chips - P.START * (1 + hero.rebuys);
    const acc = progress.decisions ? (progress.good + progress.ok / 2) / progress.decisions : null;
    $('stats').innerHTML = `
      <div><span class="label">Hands</span><b>${hero.stats.hands}</b></div>
      <div><span class="label">Won</span><b class="${net > 0 ? 'pos-c' : net < 0 ? 'neg-c' : ''}">${net > 0 ? '+' : ''}${(net / P.BB).toFixed(1)} BB</b></div>
      <div><span class="label">Accuracy</span><b>${acc === null ? '—' : pct(acc)}</b></div>
      <div><span class="label">Streak</span><b>${progress.streak}</b></div>`;
  }

  // ---------- Table ----------
  function seatPos(i, rx, ry) {
    const a = (90 + i * 360 / game.N) * Math.PI / 180;
    return [50 + rx * Math.cos(a), 47 + ry * Math.sin(a)];
  }
  function styleLabel(p) {
    if (p.human) return 'You';
    if (watching || p.stats.hands >= STYLE_REVEAL_HANDS) return p.style;
    return `Style: ? (${STYLE_REVEAL_HANDS - p.stats.hands} hands)`;
  }
  function hud(p) {
    const h = p.stats.hands;
    return h ? `VPIP ${Math.round(p.stats.vpip / h * 100)} · PFR ${Math.round(p.stats.pfr / h * 100)}` : 'VPIP – · PFR –';
  }

  const HUES = [42, 340, 205, 160, 270, 12, 190];
  function tagOf(p) {
    const t = (p.lastAction || '').toLowerCase();
    if (!t) return null;
    const amt = (t.match(/\d[\d,]*/) || [''])[0];
    if (t.startsWith('wins')) return ['win', 'Win ' + amt];
    if (t.includes('all-in')) return ['allin', 'All-in'];
    if (t.startsWith('folds')) return ['fold', 'Fold'];
    if (t.startsWith('checks')) return ['check', 'Check'];
    if (t.startsWith('calls')) return ['call', 'Call'];
    if (t.startsWith('raises')) return ['raise', 'Raise ' + amt];
    if (t.startsWith('bets')) return ['raise', 'Bet ' + amt];
    if (t.includes('blind')) return ['blind', t.startsWith('small') ? 'SB' : 'BB'];
    return null;
  }
  let shownBoard = 0, shownHand = 0;

  function renderTable() {
    const narrow = window.matchMedia('(max-width: 680px)').matches;
    const [rx, ry] = narrow ? [38, 39] : [44, 38];
    const [cx, cy] = narrow ? [22, 23] : [30, 23];
    const winners = new Set((game.lastResult?.winners || []).map(w => w.seat));
    if (game.handNo !== shownHand) { shownHand = game.handNo; shownBoard = 0; }
    let html = '<div class="felt"></div>';
    game.players.forEach((p, i) => {
      const [x, y] = seatPos(i, rx, ry);
      let cards = '';
      if (p.hole.length && !p.folded) {
        const visible = p.human || watching || p.showed;
        cards = p.hole.map(c => visible ? cardHTML(c) : '<span class="card back" aria-hidden="true"></span>').join('');
      }
      const pos = game.street !== 'idle' ? game.posOf(i) : '';
      const active = i === game.toAct;
      const cls = ['seat', active ? 'active' : '', p.folded ? 'folded' : '', p.human ? 'hero' : '', winners.has(i) ? 'winner' : ''].join(' ');
      const tag = tagOf(p);
      const name = p.human ? 'You' : p.name;
      html += `<div class="${cls}" style="left:${x}%;top:${y}%;--dur:${speed}ms">
        <div class="hole">${cards}</div>
        <div class="avwrap"><div class="av" style="--hue:${HUES[i]}">${esc(name[0])}</div>
          <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="27"/><circle class="bar" cx="32" cy="32" r="27"/></svg>
          ${pos ? `<span class="badge-pos${pos === 'BTN' ? ' btn-pos' : ''}">${pos}</span>` : ''}</div>
        ${tag ? `<span class="tag ${tag[0]}">${esc(tag[1])}</span>` : ''}
        <div class="np"><span class="nm">${esc(name)}</span><span class="stk">${fmt(p.chips)}</span>
        ${p.human ? '' : `<span class="hud" title="VPIP: how often they put money in preflop. PFR: how often they raise preflop.">${esc(watching || p.stats.hands >= STYLE_REVEAL_HANDS ? p.style : hud(p))}</span>`}</div></div>`;
      if (p.bet > 0) {
        const [bx, by] = seatPos(i, i === 0 ? cx * 0.6 : cx, i === 0 ? cy * 0.55 : cy);
        html += `<div class="bet" style="left:${bx}%;top:${by}%"><span class="stack" aria-hidden="true"><i></i><i></i><i></i></span><b>${fmt(p.bet)}</b></div>`;
      }
      if (i === game.dealer && game.street !== 'idle') {
        const [dx, dy] = seatPos(i + 0.5, cx + 3, cy + 3);
        html += `<div class="dealer" style="left:${dx}%;top:${dy}%" title="Dealer button">D</div>`;
      }
    });
    const slots = [];
    for (let k = 0; k < 5; k++) slots.push(game.board[k] !== undefined ? cardHTML(game.board[k], k >= shownBoard ? 'deal' : '') : '<span class="slot"></span>');
    shownBoard = game.board.length;
    let resultText = '', win = false;
    if (game.lastResult) {
      win = true;
      resultText = game.lastResult.winners.map(w => `${esc(w.seat === 0 && hero.human ? 'You' : w.name)} won ${fmt(w.amount)}${w.hand ? ' with ' + w.hand.toLowerCase() : ''}`).join(' · ');
    } else if (game.street === 'idle') resultText = watching ? 'Press Play to watch.' : 'Press Deal to start.';
    const streetName = game.street === 'idle' ? 'Seven seats · 10/20 No-Limit' : game.street === 'done' ? `Hand ${game.handNo} complete` : `Hand ${game.handNo} · ${game.street}`;
    html += `<div class="center"><div class="streetline">${streetName}</div>
      <div class="pot"><span class="ico" aria-hidden="true"></span><span class="label">Pot</span><b>${fmt(game.pot())}</b></div>
      <div class="board">${slots.join('')}</div>
      <div class="result${win ? ' win' : ''}">${resultText}</div></div>`;
    $('table').innerHTML = html;
  }

  // ---------- Advice for your current decision ----------
  function currentAdvice() {
    if (!hero.human || game.toAct !== 0) return null;
    const key = game.handNo + ':' + game.street + ':' + game.actions.length;
    if (key !== adviceKey) { adviceKey = key; advice = game.coach.advise(game.coachView(0)); quizShown = false; }
    return advice;
  }

  function presets(v) {
    const r10 = x => Math.round(x / 10) * 10;
    const fit = x => Math.max(Math.min(v.minTo, v.maxTo), Math.min(v.maxTo, r10(x)));
    let list;
    if (v.street === 'preflop' && v.currentBet <= P.BB) list = [['2.5 BB', 2.5 * P.BB], ['3 BB', 3 * P.BB], ['4 BB', 4 * P.BB]];
    else if (v.toCall === 0) list = [['⅓ pot', v.pot / 3], ['½ pot', v.pot / 2], ['⅔ pot', v.pot * 2 / 3], ['Pot', v.pot]];
    else list = [['2.5×', v.currentBet * 2.5], ['3×', v.currentBet * 3], ['Pot', v.currentBet + v.pot + v.toCall]];
    return list.map(([l, x]) => [l, fit(x)]);
  }

  // ---------- Dock ----------
  function renderDock() {
    const dock = $('dock');
    const handBlock = () => {
      if (!hero.human || !hero.hole.length) return `<div class="hand"><span class="label">${watching ? 'Spectating' : 'Your seat'}</span><b>${watching ? 'Watching the AI table' : 'Ready when you are'}</b><span class="muted">${watching ? 'Untick Watch AI only to play.' : 'Your cards appear on the table when the hand is dealt.'}</span></div>`;
      const pos = game.posOf(0);
      const v = game.toAct === 0 ? game.coachView(0) : null;
      return `<div class="hand"><div class="mini-cards">${hero.hole.map(c => cardHTML(c)).join('')}</div><span class="label">Your hand</span><b>${esc(P.describeHand(hero.hole, game.board))}</b>
        <div class="chips"><span class="chipinfo">${P.POS_NAMES[pos]} <b>${pos}</b></span><span class="chipinfo">Stack <b>${fmt(hero.chips)}</b></span>
        ${v && v.toCall ? `<span class="chipinfo">Pot odds <b>${pct(v.toCall / (v.pot + v.toCall))}</b></span>` : ''}</div></div>`;
    };
    if (watching) {
      dock.innerHTML = handBlock() + `<div class="acts"><div class="row"><button class="btn primary act" id="playBtn" type="button">${running ? 'Pause' : 'Play'}</button><button class="btn act" id="stepBtn" type="button">Step</button></div></div>`;
      $('playBtn').onclick = () => { running = !running; render(); schedule(); };
      $('stepBtn').onclick = () => { game.step(); render(); };
      return;
    }
    if (game.street === 'idle' || game.street === 'done') {
      dock.innerHTML = handBlock() + `<div class="acts"><div class="row"><button class="btn primary act" id="dealBtn" type="button">${game.street === 'idle' ? 'Deal' : 'Deal next hand'}</button><span class="kbd">N</span></div></div>`;
      $('dealBtn').onclick = deal;
      return;
    }
    if (game.toAct !== 0) {
      const who = game.players[game.toAct];
      const msg = hero.folded ? 'You folded. Finishing the hand<span class="dots"></span>' : game.toAct === -1 ? 'Dealing<span class="dots"></span>' : `${esc(who.name)} is thinking<span class="dots"></span>`;
      dock.innerHTML = handBlock() + `<div class="acts"><span class="waiting">${msg}</span></div>`;
      return;
    }
    const v = game.coachView(0);
    const adv = currentAdvice();
    const showPick = mode === 'teach' || (mode === 'quiz' && quizShown);
    const pick = a => showPick && adv.rec === a ? ' pick' : '';
    const ps = presets(v);
    const defTo = showPick && adv.rec === 'raise' ? adv.raiseTo : ps[Math.min(1, ps.length - 1)][1];
    const minTo = Math.min(v.minTo, v.maxTo);
    dock.innerHTML = handBlock() + `<div class="acts">
      ${v.canRaise ? `<div class="sizer">
        ${ps.map(([l, x]) => `<button class="btn small" type="button" data-size="${x}">${l}</button>`).join('')}
        <button class="btn small" type="button" data-size="${v.maxTo}">All-in</button>
        <input type="range" id="raiseRange" min="${minTo}" max="${v.maxTo}" step="10" value="${defTo}" aria-label="Bet size">
        <input type="number" id="raiseNum" min="${minTo}" max="${v.maxTo}" step="10" value="${defTo}" aria-label="Bet to">
      </div>` : ''}
      <div class="row main-acts">
        <button class="btn act fold${pick('fold')}" type="button" data-act="fold">Fold</button>
        <button class="btn act callb${pick(v.toCall ? 'call' : 'check')}" type="button" data-act="call">${v.toCall ? `Call<span class="sub">${fmt(v.toCall)}</span>` : 'Check'}</button>
        ${v.canRaise ? `<button class="btn primary act${pick('raise')}" type="button" data-act="raise">${v.currentBet > 0 ? 'Raise' : 'Bet'}<span class="sub" id="raiseLbl">${defTo}</span></button>` : ''}
      </div>
      <span class="kbd">Keys: F fold · C check/call · R ${v.currentBet > 0 ? 'raise' : 'bet'}</span>
    </div>`;
    const range = $('raiseRange'), num = $('raiseNum'), lbl = $('raiseLbl');
    const setTo = x => { if (!range) return; range.value = x; num.value = x; lbl.textContent = x; };
    if (range) {
      range.oninput = () => setTo(range.value);
      num.oninput = () => { range.value = num.value; lbl.textContent = num.value; };
      dock.querySelectorAll('[data-size]').forEach(b => b.onclick = () => setTo(b.dataset.size));
    }
    dock.querySelectorAll('[data-act]').forEach(b => b.onclick = () => heroAct(b.dataset.act));
  }

  function heroAct(a) {
    if (!hero.human || game.toAct !== 0) return;
    const num = $('raiseNum');
    const d = a === 'raise' ? { action: 'raise', raiseTo: Number(num ? num.value : 0) } : { action: a };
    const r = game.act(0, d);
    if (!r) return;
    addProgress(r);
    shownId = r.id; drill = null;
    render(); schedule();
  }

  function deal() {
    if (game.street !== 'idle' && game.street !== 'done') return;
    game.step(); render(); schedule();
  }

  // ---------- Coach ----------
  // Preflop the coach compares your hand's rank with the range for the spot; after the flop, equity with the price.
  function adviceFacts(v, adv) {
    const tile = (l, x) => `<div><span class="label">${l}</span><b>${x}</b></div>`;
    if (v.street === 'preflop') {
      const hp = adv.handPct ?? P.handPct(v.hole);
      const rank = hp <= 0.5 ? 'Top ' + pct(hp) : 'Bottom ' + Math.max(1, Math.round((1 - hp) * 100)) + '%';
      return `<div class="facts">${tile('Your hand', rank)}${tile('Plays here', adv.continueTop ? 'Top ' + pct(adv.continueTop) : '—')}${tile('Position', v.pos)}</div>`;
    }
    return `<div class="facts">${tile('Equity', pct(adv.eq))}${tile('Needed', v.toCall ? pct(adv.required) : '—')}${tile('Position', v.pos)}</div>`;
  }
  const conceptChip = k => k && P.CONCEPTS[k] ? `<button class="concept" type="button" data-concept="${k}">${P.CONCEPTS[k].title}</button>` : '';
  // "calls 20" -> "call 20" when the subject is "You".
  const youVerb = t => t.replace(/^(\w+?)s\b/, '$1');
  const recWord = (rec, toCall) => rec === 'raise' ? (toCall > 0 ? 'Raise' : 'Bet') : rec[0].toUpperCase() + rec.slice(1);

  function renderCoach() {
    $('coachSub').textContent = watching ? 'Grading every player' : { teach: 'Explains each spot before you act', quiz: 'Asks you first, explains on request', review: 'Reviews your move after you act' }[mode];
    const body = $('coachBody');
    let html = '';
    const adv = currentAdvice();
    if (adv) {
      const v = game.coachView(0);
      if (mode === 'teach' || (mode === 'quiz' && quizShown)) {
        html += `<div class="bubble lead"><div class="label">Coach suggests</div>
          <p><b>${recWord(adv.rec, v.toCall)}${adv.rec === 'raise' ? ' to ' + adv.raiseTo : ''}.</b> ${esc(adv.reason)}</p>
          ${adviceFacts(v, adv)}<div>${conceptChip(adv.concept)}</div></div>`;
      } else if (mode === 'quiz') {
        html += `<div class="bubble"><div class="label">Quiz</div>
          <p>What is your move? Think about your position (${P.POS_NAMES[v.pos]}), how strong your hand is, and ${v.toCall ? `the price: calling ${v.toCall} into a pot of ${fmt(v.pot)}` : 'whether betting gets called by worse hands'}.</p>
          <div><button class="btn small" type="button" id="revealHint">Show the coach's answer</button></div></div>`;
      } else {
        html += `<div class="bubble"><div class="label">Your move</div><p>Make your decision. I'll review it right after.</p></div>`;
      }
    }
    const r = game.reviews.find(x => x.id === shownId);
    if (r) html += feedbackHTML(r);
    if (!html) {
      html = `<div class="bubble"><p>${watching
        ? 'Click any decision below to see how the coach graded it.'
        : game.street === 'idle' ? 'Deal a hand. When it is your turn I will walk you through position, hand strength, pot odds and equity against your opponents\' likely ranges.' : 'Watch how the others play. Their tendencies show in the numbers under each name.'}</p></div>`;
    }
    body.innerHTML = html;
    const rh = $('revealHint');
    if (rh) rh.onclick = () => { quizShown = true; render(); };
    body.querySelectorAll('[data-concept]').forEach(b => b.onclick = () => openConcept(b.dataset.concept));
    const ask = $('askClaude');
    if (ask) ask.onclick = () => askClaude(r);
    const disc = $('discuss');
    if (disc) disc.onclick = () => {
      tab = 'chat'; renderTabs();
      const box = $('chatInput');
      box.value = `Review this decision with me: ${P.viewSummary(r)}`;
      box.focus();
      $('tabpane').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    body.querySelectorAll('[data-drill]').forEach(b => b.onclick = () => {
      const v = r.view, a = b.dataset.drill;
      const adv2 = game.coach.advise(v);
      drill = game.coach.review(v, { action: a, raiseTo: a === 'raise' ? adv2.raiseTo : 0, intent: '' }, adv2);
      renderCoach();
    });
    renderHistory();
  }

  function feedbackHTML(r) {
    const v = r.view, mine = r.human;
    const cs = claudeState[r.id];
    let claude = '';
    if (sample) {
      if (!cs) claude = `<button class="btn small" type="button" id="askClaude">Ask Claude why</button>`;
      else claude = `<div class="claude-out">${esc(cs.text || 'Thinking…')}</div>` + (cs.status === 'error' ? `<button class="btn small" type="button" id="askClaude">Try again</button>` : '');
    }
    let drillHTML = '';
    if (mine && r.grade !== 'good') {
      drillHTML = `<div class="row"><span class="label">Try again</span>
        <button class="btn small" type="button" data-drill="fold">Fold</button>
        <button class="btn small" type="button" data-drill="${v.toCall ? 'call' : 'check'}">${v.toCall ? 'Call' : 'Check'}</button>
        ${v.canRaise ? `<button class="btn small" type="button" data-drill="raise">${v.toCall ? 'Raise' : 'Bet'}</button>` : ''}</div>
        ${drill ? `<p><span class="grade ${drill.grade}">${GRADE[drill.grade]}</span> ${esc(drill.note)}</p>` : ''}`;
    }
    const xp = mine && r.id === lastHeroReviewId() ? `<span class="xp">+${progress.lastXp} XP</span>` : '';
    return `<div class="bubble">
      <div class="fb-head"><span class="grade ${r.grade}">${GRADE[r.grade]}</span>
        <b>${esc(mine ? 'You ' + youVerb(r.actionText) : r.name + ' ' + r.actionText)}</b><span class="muted">· ${r.street}</span>${xp}
        ${r.loss > 0 ? `<span class="num" style="color:var(--bad)">−${r.loss.toFixed(1)} BB</span>` : ''}</div>
      <div class="fb-cards">${v.hole.map(c => cardHTML(c)).join('')}<span style="width:8px"></span>${v.board.map(c => cardHTML(c)).join('')}</div>
      <p>${esc(r.note)}</p>
      ${adviceFacts(v, r)}
      <div>${conceptChip(r.concept)}</div>
      ${drillHTML}${claude}
      <div><button class="btn small" type="button" id="discuss">Discuss in chat</button></div>
    </div>`;
  }
  function lastHeroReviewId() {
    for (let i = game.reviews.length - 1; i >= 0; i--) if (game.reviews[i].human) return game.reviews[i].id;
    return -1;
  }

  function renderHistory() {
    const list = game.reviews.filter(r => watching ? true : r.human).slice(-40).reverse();
    const h = $('history');
    if (!list.length) { h.innerHTML = `<h3>${watching ? 'All decisions' : 'Your decisions'}</h3><div class="empty">${watching ? 'Graded decisions appear here.' : 'Each decision you make is graded and listed here.'}</div>`; return; }
    h.innerHTML = `<h3>${watching ? 'All decisions' : 'Your decisions'}</h3>` + list.map(r => `
      <button class="rv" type="button" data-id="${r.id}" aria-current="${r.id === shownId}">
        <span class="grade ${r.grade}">${GRADE[r.grade]}</span>
        <span class="t">${watching ? esc(r.name) + ' ' + esc(r.actionText) : esc(cap(youVerb(r.actionText)))} <span>· hand ${r.hand}, ${r.street}</span></span>
        <span class="loss">${r.loss > 0 ? '−' + r.loss.toFixed(1) : ''}</span></button>`).join('');
    h.querySelectorAll('.rv').forEach(b => b.onclick = () => { shownId = Number(b.dataset.id); drill = null; renderCoach(); });
  }

  // Token-lean prompt: one-line state, fixed instruction, short answer, cheapest tier, on click only.
  async function askClaude(r) {
    claudeState[r.id] = { status: 'loading', text: '' };
    renderCoach();
    const prompt = `Poker coach. You know only the hero's cards and public info, never opponents' cards. ` +
      `Under 60 words, plain language: was it right, the key reason, one tip.\n${P.viewSummary(r)}`;
    try {
      const { text } = await sample(prompt, {
        modelTier: 'quick',
        onText: ({ text }) => { claudeState[r.id].text = text; if (shownId === r.id) renderCoach(); },
      });
      claudeState[r.id] = { status: 'done', text };
    } catch (e) {
      if (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'cancelled') {
        if (e.code !== 'cancelled') sample = null;
        delete claudeState[r.id];
      } else {
        const copy = e.code === 'rate_limited' ? 'Too many requests right now. Try again in a minute.' : 'Claude could not answer this time.';
        claudeState[r.id] = { status: 'error', text: (e.text ? e.text + '\n\n' : '') + copy };
      }
    }
    renderCoach();
  }

  // ---------- Study tabs ----------
  function openConcept(k) { tab = 'lessons'; hlConcept = k; renderTabs(); document.querySelector(`[data-lesson="${k}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(t => { t.setAttribute('aria-selected', String(t.dataset.tab === tab)); t.onclick = () => { tab = t.dataset.tab; hlConcept = null; renderTabs(); }; });
    const pane = $('tabpane');
    if (tab === 'chat') {
      if (pane.dataset.tab !== 'chat') { pane.dataset.tab = 'chat'; pane.innerHTML = chatShell(); bindChat(); renderChat(); }
      return;
    }
    pane.dataset.tab = tab;
    if (tab === 'lessons') {
      pane.innerHTML = `<p class="note">Concepts from modern solver-based (GTO) strategy. Each graded decision is tagged with the concept it tests, and your practice score shows here.</p>
        <div class="lessons">${Object.entries(P.CONCEPTS).map(([k, c]) => {
          const s = progress.concepts[k];
          const score = s && s.n ? s.pts / s.n : 0;
          return `<div class="lesson${hlConcept === k ? ' hl' : ''}" data-lesson="${k}"><h3>${c.title}</h3><p>${esc(c.text)}</p>
            <div class="meter" aria-hidden="true"><span style="width:${score * 100}%"></span></div>
            <div class="m"><span>${s ? s.n + ' practised' : 'Not practised yet'}</span><span>${s && s.n ? pct(score) : ''}</span></div></div>`;
        }).join('')}</div>`;
    } else if (tab === 'opponents') {
      const rows = game.players.filter(p => !p.human).map(p => {
        const s = p.stats, h = s.hands;
        const known = watching || h >= STYLE_REVEAL_HANDS;
        const acc = s.decisions ? (s.good + s.ok / 2) / s.decisions : null;
        const net = p.chips - P.START * (1 + p.rebuys);
        const drift = (a, b) => a.toFixed(2) === b.toFixed(2) ? `<span class="drift">${b.toFixed(2)}</span>` : `<span class="drift">${a.toFixed(2)} <span class="arrow">→</span> ${b.toFixed(2)}</span>`;
        const leak = Object.entries(s.leaks).sort((a, b) => b[1] - a[1])[0];
        return `<tr><td><b>${esc(p.name)}</b></td><td>${known ? esc(p.style) : '?'}</td>
          <td class="n">${h}</td><td class="n">${h ? pct(s.vpip / h) : '—'}</td><td class="n">${h ? pct(s.pfr / h) : '—'}</td>
          <td class="n ${net > 0 ? 'pos-c' : net < 0 ? 'neg-c' : ''}">${(net / P.BB).toFixed(0)}</td>
          <td class="n">${acc === null ? '—' : pct(acc)}</td>
          <td>${drift(p.startProf.openMult, p.prof.openMult)}</td><td>${drift(p.startProf.callMargin, p.prof.callMargin)}</td><td>${drift(p.startProf.bluff, p.prof.bluff)}</td>
          <td class="muted">${leak ? esc(leak[0]) : '—'}</td></tr>`;
      }).join('');
      pane.innerHTML = `<p class="note">Read your opponents. VPIP is how often a player puts money in before the flop; PFR is how often they raise. A high VPIP with a low PFR is a calling station: bluff less, value bet more. Styles reveal after ${STYLE_REVEAL_HANDS} hands. The AI players also learn from the coach, shown as their settings drift.</p>
        <div class="scroll"><table><thead><tr><th>Player</th><th>Style</th><th class="n">Hands</th><th class="n">VPIP</th><th class="n">PFR</th><th class="n">Net BB</th><th class="n">Coach score</th><th>Range width</th><th>Call margin</th><th>Bluff rate</th><th>Top leak</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    } else {
      const lines = game.actions.map(a => esc(a.text));
      if (game.lastResult) lines.push(...game.lastResult.winners.map(w => `${esc(w.name)} wins ${fmt(w.amount)}${w.hand ? ' (' + w.hand + ')' : ''}`));
      pane.innerHTML = `<div class="log">${lines.length ? lines.join('<br>') : 'The current hand\'s actions appear here.'}</div>`;
    }
  }

  // ---------- Coach chat ----------
  // Claude handles the conversation; all numbers come from the local engine through page tools.
  const SUGGESTIONS = [
    'Explain 3-bet ranges simply',
    'How should I play against a calling station?',
    'I had AsKd on the button, flop Qh7c2d, villain bet half pot. Call or raise?',
    'What are my biggest leaks so far and how do I fix them?',
  ];

  function chatRules() {
    const leaks = Object.entries(hero.stats.leaks).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => `${k} (${n})`).join(', ');
    const acc = progress.decisions ? pct((progress.good + progress.ok / 2) / progress.decisions) : 'no data';
    return `You are a friendly No-Limit Hold'em study coach in a training app. Teach with modern solver (GTO) ideas plus exploitative adjustments. ` +
      `Answer in under 120 words unless asked for more; plain language, define jargon once. Use the tools for equity and preflop ranges instead of estimating numbers. ` +
      `This chat is for study and for reviewing finished hands. If the player says a real-money hand on another site is in progress, say you will review it once the hand is over. ` +
      `Player in this app: accuracy ${acc}; top leaks: ${leaks || 'none yet'}.`;
  }

  const POSITIONS = ['UTG', 'MP', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
  const TOOLS = [
    {
      name: 'equity',
      description: 'Monte Carlo equity for a hand against opponent ranges. Returns equity 0-1, the made hand, draws and outs; with pot and to_call also returns required equity and minimum defense frequency.',
      inputSchema: { type: 'object', properties: {
        hero: { type: 'string', description: 'Hero hole cards, e.g. "AsKd"' },
        board: { type: 'string', description: 'Board cards, e.g. "Qh7c2d", or empty' },
        opponent_ranges: { type: 'array', items: { type: 'number' }, description: 'One per opponent: top share of hands held, 0.02 to 1 (1 = any two cards). Opener UTG ~0.15, BTN ~0.44, 3-bettor ~0.08.' },
        pot: { type: 'number', description: 'Pot before hero acts, including any bet faced' },
        to_call: { type: 'number' },
      }, required: ['hero', 'opponent_ranges'] },
      execute(i) {
        const hole = P.parseCards(i.hero), board = P.parseCards(i.board || '');
        if (hole.length !== 2) throw new Error('hero needs exactly two cards');
        if (board.length > 5) throw new Error('board has at most five cards');
        const ranges = (Array.isArray(i.opponent_ranges) && i.opponent_ranges.length ? i.opponent_ranges : [1]).slice(0, 6).map(x => Math.min(1, Math.max(0.02, Number(x) || 1)));
        const eq = P.equity(hole, board, ranges.length, 2500, ranges);
        const out = { equity: Math.round(eq * 1000) / 1000, hand: P.describeHand(hole, board) };
        const pot = Number(i.pot), call = Number(i.to_call);
        if (pot > 0 && call > 0) {
          out.required_equity = Math.round(call / (pot + call) * 1000) / 1000;
          out.mdf = Math.round((pot - call) / pot * 1000) / 1000;
        }
        return out;
      },
    },
    {
      name: 'preflop_advice',
      description: 'Solver-style preflop action for a 7-handed 100bb cash game. Returns the recommended action, raise size in chips (blinds 10/20), the hand percentile, and a reason.',
      inputSchema: { type: 'object', properties: {
        hand: { type: 'string', description: 'Hand class like "AJo", "T9s", "77", or exact cards "AsJd"' },
        position: { type: 'string', enum: POSITIONS },
        facing: { type: 'string', enum: ['unopened', 'open', '3bet', '4bet'], description: 'unopened = folded to hero; open = one raise before hero; 3bet = hero opened and got re-raised; 4bet = hero 3-bet and got re-raised' },
        raiser_position: { type: 'string', enum: POSITIONS },
      }, required: ['hand', 'position', 'facing'] },
      execute(i) {
        const pos = POSITIONS.includes(i.position) ? i.position : 'CO';
        const rpos = POSITIONS.includes(i.raiser_position) && i.raiser_position !== pos ? i.raiser_position : (pos === 'BTN' ? 'CO' : 'BTN');
        const raise = seat => ({ seat, street: 'preflop', type: 'raise' });
        const spots = {
          unopened: { actions: [], currentBet: P.BB, toCall: pos === 'BB' ? 0 : pos === 'SB' ? P.SB : P.BB },
          open: { actions: [raise(1)], currentBet: 50, toCall: 50 },
          '3bet': { actions: [raise(0), raise(1)], currentBet: 150, toCall: 100 },
          '4bet': { actions: [raise(1), raise(0), raise(1)], currentBet: 350, toCall: 200 },
        };
        const sp = spots[i.facing] || spots.unopened;
        const v = { hole: P.holeFromKey(i.hand), pos, posOf: { 0: pos, 1: rpos }, street: 'preflop', canRaise: true,
          actions: sp.actions, currentBet: sp.currentBet, toCall: sp.toCall, minTo: sp.currentBet * 2, maxTo: P.START };
        const plan = P.preflopPlan(v);
        return { action: plan.rec, raise_to: plan.rec === 'raise' ? plan.raiseTo : null, hand_percentile: Math.round(plan.handPct * 1000) / 1000, reason: plan.reason };
      },
    },
  ];

  function chatShell() {
    return `<div class="chat">
      <p class="note">Talk strategy or walk the coach through a hand you played. Numbers come from the app's own equity and range calculator. For study and finished hands only: real-money sites ban outside help during a hand.</p>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="suggest" id="suggest"></div>
      <div class="composer">
        <textarea id="chatInput" placeholder="Ask about a spot, a concept, or a hand you played…" aria-label="Message the coach"></textarea>
        <button class="btn primary" type="button" id="chatSend">Send</button>
      </div>
    </div>`;
  }

  function bindChat() {
    const box = $('chatInput');
    $('chatSend').onclick = () => { if (chatBusy) chatCtl?.abort(); else sendChat(box.value); };
    box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!chatBusy) sendChat(box.value); } };
  }

  const fmtMsg = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

  function renderChat() {
    const msgs = $('msgs');
    if (!msgs) return;
    if (!sample) {
      msgs.innerHTML = `<div class="msg assistant">Coach chat works when this page is opened in Claude and Claude is allowed for it.</div>`;
    } else if (!chat.length) {
      msgs.innerHTML = `<div class="msg assistant">Hi, I'm your coach. Ask me about any spot, or describe a hand you played (cards, position, board, bets) and we'll go through it.</div>`;
    } else {
      msgs.innerHTML = chat.map(m => `<div class="msg ${m.role}${m.err ? ' err' : ''}">${m.content ? fmtMsg(m.content) : 'Thinking…'}</div>`).join('');
      msgs.scrollTop = msgs.scrollHeight;
    }
    $('suggest').innerHTML = sample && !chat.length ? SUGGESTIONS.map((t, k) => `<button class="pill concept" type="button" data-s="${k}">${esc(t)}</button>`).join('') : '';
    $('suggest').querySelectorAll('[data-s]').forEach(b => b.onclick = () => sendChat(SUGGESTIONS[Number(b.dataset.s)]));
    $('chatSend').textContent = chatBusy ? 'Stop' : 'Send';
    $('chatSend').disabled = !sample;
  }

  async function sendChat(text) {
    text = String(text || '').trim();
    if (!text || chatBusy || !sample) return;
    chat.push({ role: 'user', content: text });
    $('chatInput').value = '';
    const turns = [{ role: 'user', content: chatRules() }, ...chat.filter(m => !m.err && m.content).slice(-12)];
    const reply = { role: 'assistant', content: '' };
    chat.push(reply);
    chatBusy = true; chatCtl = new AbortController();
    renderChat();
    const opts = { cache: false, signal: chatCtl.signal, onText: ({ text }) => { reply.content = text; renderChat(); } };
    if (toolsOk) opts.tools = TOOLS;
    try {
      reply.content = (await sample(turns, opts)).text;
    } catch (e) {
      if (e.code === 'cancelled') reply.content = e.text || '(stopped)';
      else {
        reply.err = true;
        reply.content = (e.text ? e.text + '\n\n' : '') + ({
          not_granted: 'Claude is not allowed for this page.',
          rate_limited: 'Too many requests right now. Try again in a minute.',
          sampling_disabled: 'Claude is not available on this account.',
        }[e.code] || 'The coach could not answer this time. Try again.');
        if (e.code === 'not_granted' || e.code === 'sampling_disabled') sample = null;
      }
    }
    chatBusy = false; chatCtl = null;
    renderChat();
  }

  // ---------- Loop ----------
  function render() { renderHeader(); renderTable(); renderDock(); renderCoach(); renderTabs(); }

  function schedule() {
    clearTimeout(timer);
    if (watching) {
      if (running) timer = setTimeout(tick, game.street === 'done' ? speed * 2.5 : speed);
      return;
    }
    if (game.street === 'idle' || game.street === 'done' || game.toAct === 0) return;
    timer = setTimeout(tick, hero.folded ? 90 : speed);
  }
  function tick() {
    game.step();
    if (game.street === 'done' && tab !== 'lessons') renderTabs();
    render();
    schedule();
  }

  $('mode').onchange = e => { mode = e.target.value; render(); };
  const applyDeck = on => { document.body.classList.toggle('two-color', !on); try { localStorage.setItem('pokercoach.fourColor', on ? '1' : '0'); } catch (e) {} };
  try { if (localStorage.getItem('pokercoach.fourColor') === '0') $('fourColor').checked = false; } catch (e) {}
  applyDeck($('fourColor').checked);
  $('fourColor').onchange = e => applyDeck(e.target.checked);
  $('speed').onchange = e => { speed = Number(e.target.value); };
  $('watch').onchange = e => {
    watching = e.target.checked; running = false;
    setHero(!watching);
    shownId = null;
    render(); schedule();
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'n') deal();
    else if (game.toAct === 0 && hero.human) {
      if (k === 'f') heroAct('fold');
      else if (k === 'c') heroAct('call');
      else if (k === 'r' && $('raiseNum')) heroAct('raise');
    }
  });
  window.addEventListener('resize', renderTable);

  render(); renderTabs();

  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(async s => {
      sample = s;
      if (s) { const lim = await s.limits().catch(() => null); toolsOk = !!lim?.tools; }
      renderCoach(); renderTabs(); renderChat();
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
